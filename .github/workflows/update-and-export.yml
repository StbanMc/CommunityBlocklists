name: Update & Export Blocklists

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update blocklists from sources
        run: bash scripts/update_lists.sh

      - name: Export to all formats
        run: bash scripts/export_formats.sh

      - name: Generate manifest.json
        run: bash scripts/generate_manifest.sh

      - name: Package SquidGuard tarball
        run: bash scripts/package_squidguard.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # exports/squidguard/ holds the binary tarball — it is published
          # via gh-pages (direct download) and as a Release asset (versioned
          # download). Keep it out of main so the repo does not balloon.
          echo "exports/squidguard/" >> .gitignore
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DOMAINS=$(wc -l < exports/combined/all-domains.txt)
            git commit -m "chore: weekly blocklist update ($(date -u +%Y-%m-%d)) - ${DOMAINS} domains"
            git push
          fi

      - name: Publish tarball to gh-pages (direct download)
        run: |
          set -euo pipefail
          TARBALL="exports/squidguard/squidguard.tar.gz"
          CHECKSUM="${TARBALL}.sha256"

          # Stage the gh-pages content in a clean worktree so we never touch
          # main's working tree.
          WT="$(mktemp -d)"
          git worktree add --orphan -B gh-pages "$WT"
          find "$WT" -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +

          cp "$TARBALL"  "$WT/squidguard.tar.gz"
          cp "$CHECKSUM" "$WT/squidguard.tar.gz.sha256"
          touch "$WT/.nojekyll"

          cat > "$WT/index.html" <<'HTML'
          <!doctype html>
          <html lang="en"><head>
          <meta charset="utf-8">
          <title>CommunityBlocklists — SquidGuard tarball</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
            body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:4rem auto;padding:0 1.5rem;line-height:1.6;color:#1a1a1a}
            h1{font-size:1.6rem;margin-bottom:.3rem}
            a{color:#0a5dc9}
            code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem}
            pre{background:#f5f5f5;padding:1rem;border-radius:6px;overflow-x:auto}
            .muted{color:#666}
          </style></head><body>
          <h1>CommunityBlocklists</h1>
          <p class="muted">Direct-download mirror for SquidGuard / pfSense.</p>
          <p>Stable URL for <strong>pfSense &rarr; Services &rarr; SquidGuard Proxy Filter &rarr; Blacklist</strong>:</p>
          <pre>https://stbanmc.github.io/CommunityBlocklists/squidguard.tar.gz</pre>
          <p>Integrity check:</p>
          <pre>https://stbanmc.github.io/CommunityBlocklists/squidguard.tar.gz.sha256</pre>
          <p>Source repository, other formats (Pi-hole, AdGuard, pfBlockerNG, dnsmasq, Unbound), and contribution guide: <a href="https://github.com/StbanMc/CommunityBlocklists">github.com/StbanMc/CommunityBlocklists</a>.</p>
          </body></html>
          HTML

          cd "$WT"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "pages: squidguard.tar.gz ($(date -u +%Y-%m-%d))"
          git push -f origin gh-pages
          cd -
          git worktree remove "$WT" --force

      - name: Publish tarball to Release (versioning)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="latest"
          TARBALL="exports/squidguard/squidguard.tar.gz"
          CHECKSUM="${TARBALL}.sha256"

          if [ ! -f "$TARBALL" ]; then
            echo "ERROR: tarball not found at $TARBALL" >&2
            exit 1
          fi

          # Recreate the rolling "latest" release so the asset URL stays stable.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          NOTES_FILE="$(mktemp)"
          {
            echo "Rolling release with the latest SquidGuard-compatible tarball."
            echo ""
            echo "**Build date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**SHA-256:**    \`$(awk '{print $1}' "$CHECKSUM")\`"
            echo "**Size:**       $(du -h "$TARBALL" | awk '{print $1}')"
            echo ""
            echo "### Recommended URL for pfSense / OPNsense (direct, no redirects):"
            echo ""
            echo "    https://stbanmc.github.io/CommunityBlocklists/squidguard.tar.gz"
            echo ""
            echo "The asset below is also available, but GitHub Releases serve through a"
            echo "signed-redirect chain that SquidGuard's downloader does not follow well —"
            echo "prefer the Pages URL above for the firewall, and use the asset here only"
            echo "for manual download / auditing."
          } > "$NOTES_FILE"

          gh release create "$TAG" \
            --title "Latest SquidGuard tarball" \
            --notes-file "$NOTES_FILE" \
            --latest \
            "$TARBALL" "$CHECKSUM"

          rm -f "$NOTES_FILE"
