name: Update & Export Blocklists

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update blocklists from sources
        run: bash scripts/update_lists.sh

      - name: Export to all formats
        run: bash scripts/export_formats.sh

      - name: Generate manifest.json
        run: bash scripts/generate_manifest.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DOMAINS=$(wc -l < exports/combined/all-domains.txt)
            git commit -m "chore: weekly blocklist update ($(date -u +%Y-%m-%d)) - ${DOMAINS} domains"
            git push
          fi
